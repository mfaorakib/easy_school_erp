; Supervisor config for the easyschool-erp production container.
;
; Render.com's free tier has no persistent disk and no separate
; worker/cron service, so nginx, php-fpm, the queue worker, and a
; cron-substitute scheduler loop all run as sibling processes in this one
; container, managed here. docker/entrypoint.sh execs
; `supervisord -c /etc/supervisor/conf.d/supervisord.conf` (this file, at
; that exact path) as the container's final step, after one-time boot
; tasks (migrations, cache warming, etc.) have finished.

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
startretries=10
priority=5
stopsignal=QUIT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=10
priority=10
stopsignal=QUIT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue-worker]
command=php /var/www/html/artisan queue:work --tries=3 --sleep=3 --max-time=3600
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
startretries=50
startsecs=5
stopwaitsecs=30
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
; No cron/separate scheduler service on Render's free tier - this loop
; calls artisan schedule:run once a minute, standing in for a real
; system crontab entry.
command=/bin/sh -c "while true; do php /var/www/html/artisan schedule:run --verbose --no-interaction; sleep 60; done"
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
startretries=50
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
